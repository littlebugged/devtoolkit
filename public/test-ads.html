<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ad Test Page</title>
  <style>
    body { background: #1a1a2e; color: #fff; font-family: sans-serif; padding: 20px; }
    .test-block { border: 1px solid #333; margin: 20px 0; padding: 15px; border-radius: 8px; }
    .test-block h3 { margin-top: 0; color: #7c6ff5; }
    .status { color: #888; font-size: 14px; }
    #log { background: #111; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Adsterra Ad Script Test</h1>
  <p class="status">This page tests ad scripts in isolation (no Astro framework).</p>

  <div class="test-block">
    <h3>1. Banner 728x90</h3>
    <script data-cfasync="false" type="text/javascript">
      atOptions = {
        'key' : 'ce88094cd4550c185792b9388fca6963',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script data-cfasync="false" type="text/javascript" src="https://www.highperformanceformat.com/ce88094cd4550c185792b9388fca6963/invoke.js"></script>
  </div>

  <div class="test-block">
    <h3>2. Native Banner</h3>
    <script async data-cfasync="false" type="text/javascript" src="https://pl30613585.effectivecpmnetwork.com/bf08dea8c88068055e396ef4d75871bd/invoke.js"></script>
    <div id="container-bf08dea8c88068055e396ef4d75871bd"></div>
  </div>

  <div class="test-block">
    <h3>3. Mobile Banner 320x50</h3>
    <script data-cfasync="false" type="text/javascript">
      atOptions = {
        'key' : '39dadd8402e5535e2cc01e654c00b6c8',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script data-cfasync="false" type="text/javascript" src="https://www.highperformanceformat.com/39dadd8402e5535e2cc01e654c00b6c8/invoke.js"></script>
  </div>

  <div class="test-block">
    <h3>4. Social Bar / Popunder</h3>
    <script async data-cfasync="false" type="text/javascript" src="https://pl30613587.effectivecpmnetwork.com/b2/19/e0/b219e04b0e76ad939e61f83b271f5d1a.js"></script>
  </div>

  <h3>Console Log</h3>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
    }

    log('Page loaded. Testing ad scripts...');
    log('Domain: ' + location.hostname);
    log('Protocol: ' + location.protocol);

    const scripts = [
      'https://www.highperformanceformat.com/ce88094cd4550c185792b9388fca6963/invoke.js',
      'https://www.highperformanceformat.com/39dadd8402e5535e2cc01e654c00b6c8/invoke.js',
      'https://pl30613585.effectivecpmnetwork.com/bf08dea8c88068055e396ef4d75871bd/invoke.js',
      'https://pl30613587.effectivecpmnetwork.com/b2/19/e0/b219e04b0e76ad939e61f83b271f5d1a.js'
    ];

    scripts.forEach(url => {
      fetch(url)
        .then(r => log(`${r.status} ${r.statusText} - ${url.split('/').pop()}`))
        .catch(e => log(`ERROR - ${url.split('/').pop()}: ${e.message}`));
    });

    window.addEventListener('error', function(e) {
      if (e.filename) log('Script error: ' + e.filename);
    }, true);
  </script>
</body>
</html>
